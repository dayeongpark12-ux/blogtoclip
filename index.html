<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f8fafc">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>타요의 씽씽극장 썸네일 송북 도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--primary:#0f172a;--tayo-blue:#0284c7;--tayo-red:#ef4444;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 14px 48px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:24px;text-align:center;margin:6px 0 4px;font-weight:800;letter-spacing:-.03em}
.sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 16px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input,textarea,select,button{font:inherit}
input[type=text],input[type=url],input[type=password],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical;font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:650;transition:all 0.15s;font-size:13px}
.btn:hover{background:#f1f5f9}
.btn.primary{background:#0f172a;color:white;border-color:#0f172a}
.btn.primary:hover{background:#334155}
.btn.accent{background:#ef4444;color:white;border-color:#ef4444}
.btn.accent:hover{background:#dc2626}
.btn.success{background:#059669;color:white;border-color:#059669}
.btn.success:hover{background:#047857}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* 수록곡 목록 */
.tracklist{display:grid;gap:6px}
.track{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:8px 12px;border-radius:8px;background:#fff}
.track input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.track .name{font-weight:650;font-size:13px}
.track .num{color:var(--muted);font-size:12px;font-weight:700}

/* 유튜브 후보 카드 스타일 */
.candidates{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:12px;margin-top:12px}
.candidate{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column}
.candidate .thumb-box{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#e2e8f0}
.candidate .thumb-box img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);display:block}
.candidate h3{font-size:13px;line-height:1.4;margin:8px 0 4px;overflow-wrap:anywhere}
.candidate .meta{font-size:11px;color:var(--muted);margin-bottom:8px}
.candidate .pick{display:flex;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:12px;align-items:center;justify-content:space-between}
.candidate .pick label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin:0}

/* ========================================================== */
/* 1번 사진 완벽 일치 송북 디자인                              */
/* ========================================================== */
.songbooks-container{
  display:flex;
  flex-direction:column;
  gap:24px;
  align-items:center;
}

/* 1개의 독립된 송북 카드 (A5 규격) */
.single-songbook{
  border:2px dashed #94a3b8;
  border-radius:14px;
  padding:16px 14px 18px;
  background:#ffffff;
  width:100%;
  max-width:440px; /* 1번 사진 비율에 맞춘 최적 너비 */
  box-shadow:0 4px 18px rgba(0,0,0,0.05);
  display:flex;
  flex-direction:column;
}

/* 상단 헤더: 자동차 그림 삭제, 중앙 정렬, 점선 언더라인 */
.songbook-header{
  display:flex;
  justify-content:center;
  align-items:center;
  padding-bottom:10px;
  margin-bottom:14px;
  border-bottom:2px dashed #cbd5e1;
  text-align:center;
}
.songbook-header h2{
  margin:0;
  font-size:24px;
  font-weight:900;
  color:#ef4444; /* 1번 사진의 타요 씽씽극장 레드 타이틀 */
  letter-spacing:-0.03em;
  text-align:center;
}

/* 2열 4행 그리드 (최대 8개) */
.songbook-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(4, minmax(0, 1fr));
  gap:12px 10px;
  flex:1;
}

/* 각 곡 항목: 썸네일과 곡 제목 둘러싼 개별 테두리 완전 삭제! */
.song-item{
  border:none; /* 개별 테두리 삭제 */
  padding:0;
  margin:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* 썸네일 위아래 검정 레터박스(여백) 완전 제거 컨테이너 */
.thumb-crop{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:8px;
  position:relative;
  background:#f1f5f9;
}
.thumb-crop img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.18); /* 유튜브 4:3 썸네일 상하 검정 띠 완전 크롭 */
  display:block;
}
.thumb-crop .missing{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:11px;
  color:var(--muted);
  border:1px dashed #cbd5e1;
  border-radius:8px;
}

/* 곡 제목: 썸네일 바로 아래 밀착 중앙 정렬 */
.song-item .song-title{
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  margin-top:5px;
  color:#1e293b;
  overflow-wrap:anywhere;
  word-break:keep-all;
  text-align:center;
}

/* 송북별 액션 버튼 */
.songbook-actions{
  margin-top:14px;
  padding-top:10px;
  border-top:1px solid #f1f5f9;
  display:flex;
  gap:6px;
  justify-content:flex-end;
}

/* MP3 모달 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}
.modal-box{background:white;border-radius:14px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,0.25)}
.mp3-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.mp3-btn-group{display:flex;gap:4px;flex-shrink:0}

/* 인쇄 및 PDF 저장 시 1번 사진 스타일 100% 적용 */
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{background:white!important;margin:0!important;padding:0!important}
  main{max-width:none!important;margin:0!important;padding:0!important}
  .no-print,header,.sub,.panel:not(#previewPanel),.songbook-actions{display:none!important}
  #previewPanel{border:0!important;padding:0!important;margin:0!important;background:transparent!important}
  .songbooks-container{display:block!important}
  .single-songbook{page-break-after:always;border:2px dashed #000!important;max-width:none!important;margin:0 0 12mm 0!important;box-shadow:none!important;padding:8mm!important}
  .songbook-header h2{color:#ef4444!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .thumb-crop img{-webkit-print-color-adjust:exact;print-color-adjust:exact;transform:scale(1.18)!important}
}
</style>
</head>
<body><main>
<header class="no-print">
  <h1>타요의 씽씽극장 썸네일 송북 도구</h1>
  <p class="sub">1번 사진 레이아웃 반영 · 헤드라인 중앙 정렬 · 검정 여백 및 카드 테두리 삭제</p>
</header>

<section class="panel no-print">
  <h2>1. 앨범명 및 수록곡 목록</h2>
  <div class="grid">
    <div>
      <label for="album">앨범명</label>
      <input id="album" type="text" value="타요의 씽씽극장" placeholder="앨범명 입력">
    </div>
    <div>
      <label for="headline">출력 상단 헤드라인 (중앙 정렬)</label>
      <input id="headline" type="text" value="타요의 씽씽극장" placeholder="출력물 상단 제목">
    </div>
  </div>

  <div style="margin-top:12px">
    <label for="songs">수록곡 목록 (세 번째 필드: 한 줄에 한 곡)</label>
    <textarea id="songs">오프닝
꼬마버스가 출발합니다
용감한 자동차들
주룩주룩 첨벙첨벙
천하장사 중장비
뚝딱뚝딱 만능 정비사
꿈나라로 쿨쿨쿨
많이 많이 닮았네
정다운 시골여행
반짝반짝 상쾌한 하루
행복을 배달해요
푸른 하늘 높이
환상의 우주 여행
아침이 밝았어요
엔딩</textarea>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" id="apply">곡 목록 적용</button>
    <button class="btn" id="all">전체 선택</button>
    <button class="btn" id="none">전체 해제</button>
    <button class="btn" id="csvin">CSV 불러오기</button>
    <input id="csvfile" type="file" accept=".csv,text/csv" hidden>
  </div>
</section>

<section class="panel no-print">
  <h2>2. 수록곡 목록 · 추출 여부 선택</h2>
  <div id="tracklist" class="tracklist"></div>
</section>

<section class="panel no-print">
  <h2>3. 곡별 유튜브 후보 지정</h2>
  <div style="margin-bottom:14px">
    <label for="ytkey">YouTube Data API v3 키 (영구 고정 보관)</label>
    <input id="ytkey" type="password" autocomplete="off" placeholder="YouTube API 키 입력 (1회 입력 시 자동 보존됩니다)">
    <p class="hint">키를 입력해두시면 브라우저에 저장되어 재접속 시에도 계속 유지됩니다.</p>
  </div>
  <div id="candidateEditor"></div>
</section>

<section class="panel" id="previewPanel">
  <div class="row no-print" style="justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0">송북 미리보기 (1번 사진 디자인 적용)</h2>
    <span id="count" style="font-size:12px;font-weight:700;color:var(--tayo-blue);background:#e0f2fe;padding:4px 8px;border-radius:6px">0곡 선택</span>
  </div>
  
  <div id="previewContainer" class="songbooks-container"></div>

  <div class="row no-print" style="margin-top:20px;gap:8px">
    <button class="btn success" id="downloadAllPdfBtn" style="font-size:14px;font-weight:750">📄 전체 송북 PDF 다운로드</button>
    <button class="btn primary" id="downloadAllImgBtn" style="font-size:14px;font-weight:750">🖼️ 전체 송북 이미지(PNG) 저장</button>
    <button class="btn accent" id="downloadMp3Btn">🎵 선택 음원 MP3 다운로드</button>
    <button class="btn" id="savePreviewHtml">송북 HTML 저장</button>
    <button class="btn" id="savecsv">CSV 저장</button>
    <button class="btn" id="print">인쇄 창 열기</button>
  </div>
</section>
</main>

<div class="modal-overlay" id="mp3Modal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:17px">🎵 MP3 음원 파일 다운로드</h3>
      <button class="btn" onclick="$('mp3Modal').style.display='none'">닫기</button>
    </div>
    <p class="hint" style="margin-top:0">원하시는 곡의 다운로드 채널을 누르시면 MP3 변환 페이지로 바로 이동합니다.</p>
    <div id="mp3List" style="margin:12px 0"></div>
    <div class="row" style="justify-content:space-between;margin-top:14px;gap:6px">
      <button class="btn" id="downloadUrlTxt">URL 목록 텍스트</button>
      <button class="btn primary" id="downloadPyScript">파이썬 원클릭 전곡 다운로드(.py)</button>
      <button class="btn" id="downloadBatScript">윈도우 배치파일(.bat)</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
