<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>앨범 썸네일 정리 & 송북 도구</title>
<style>
:root{--ink:#202124;--muted:#6b7280;--line:#e5e7eb;--pink:#ed4c98;--bg:#f7f7f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1160px;margin:0 auto;padding:24px 16px 48px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
h1{font-size:28px;line-height:1.3;text-align:center;margin:8px 0 4px;font-weight:800;letter-spacing:-.04em}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
h2{font-size:18px;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input,textarea,select,button{font:inherit}
input[type=text],input[type=url],input[type=password],textarea,select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #d1d5db;background:white;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:650;transition:all 0.2s}
.btn:hover{background:#f3f4f6}
.btn.primary{background:#202124;color:white;border-color:#202124}
.btn.primary:hover{background:#374151}
.btn.accent{background:#e11d48;color:white;border-color:#e11d48}
.btn.accent:hover{background:#be123c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* 수록곡 목록 */
.tracklist{display:grid;gap:8px}
.track{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px}
.track input[type=checkbox]{width:17px;height:17px}
.track .name{font-weight:650}
.track .num{color:var(--muted);font-size:12px}

/* 유튜브 후보 카드 스타일 (큼직한 썸네일, URL 입력 필드 삭제) */
.candidates{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:16px;margin-top:14px}
.candidate{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column}
.candidate img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.candidate h3{font-size:14px;line-height:1.4;margin:10px 0 6px;overflow-wrap:anywhere}
.candidate .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.candidate .pick{display:flex;gap:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px;align-items:center;justify-content:space-between}
.candidate .pick label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin:0}

/* 미리보기 화면 레이아웃 (A4 1장에 최대 2세트 수용) */
.preview-page{background:white;padding:24px;border:1px solid var(--line);border-radius:14px;margin-bottom:28px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;page-break-after:always}
.preview-set{border:1px solid #f0f0f0;border-radius:10px;padding:14px;background:#fafafa}
/* 헤드라인과 썸네일 묶음 간 간격 넉넉하게 확장 */
.output-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 20px 0;padding-bottom:8px;border-bottom:2px solid #e5e7eb}
.thumbgrid{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px 12px}
.thumbcard{min-width:0;text-align:center;break-inside:avoid}
.thumbcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:#f0f0f0}
.thumbcard .missing{aspect-ratio:16/9;border:1px dashed #c7c7c7;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:11px}
/* 썸네일과 노래제목 간격 축소 */
.thumbcard .caption{font-size:12px;font-weight:700;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}

/* MP3 모달 레이아웃 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:white;border-radius:16px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,0.2)}
.mp3-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}

/* 인쇄 및 PDF 저장 시 오직 미리보기 콘텐츠(헤드라인, 썸네일, 곡이름)만 출력 */
@media print{
  @page{size:A4 landscape;margin:6mm}
  html,body{background:white!important;margin:0!important;padding:0!important}
  main{max-width:none!important;margin:0!important;padding:0!important}
  .no-print,header,.sub,.panel:not(#previewPanel){display:none!important}
  #previewPanel{border:0!important;padding:0!important;margin:0!important;background:transparent!important}
  .preview-page{border:0!important;padding:0!important;margin:0 0 10mm 0!important;gap:16px!important}
  .preview-set{border:0!important;padding:0!important;background:transparent!important}
  .output-title{font-size:16pt!important;margin:0 0 14px 0!important;border-bottom:1.5pt solid #202124!important}
  .thumbgrid{gap:6px 10px!important}
  .thumbcard .caption{font-size:10pt!important;margin-top:2px!important}
}
</style>
</head>
<body><main>
<header class="no-print">
  <h1>앨범 썸네일 정리 & 송북 도구</h1>
  <p class="sub">A4 한 장 2세트 인쇄 · 썸네일 간격 최적화 · MP3 저장</p>
</header>

<section class="panel no-print">
  <h2>1. 앨범과 수록곡</h2>
  <div class="grid">
    <div>
      <label for="album">앨범명</label>
      <div style="display:flex;gap:6px">
        <input id="album" type="text" value="타요 씽씽극장" placeholder="앨범명 입력">
        <button class="btn primary" id="searchAlbumBtn" style="white-space:nowrap">앨범 곡 불러오기</button>
      </div>
    </div>
    <div>
      <label for="headline">상단 헤드라인</label>
      <input id="headline" type="text" value="타요 씽씽극장" placeholder="출력물 상단 제목">
    </div>
  </div>

  <div style="margin-top:14px">
    <label for="songs">수록곡 목록 (세 번째 필드: 한 줄에 한 곡)</label>
    <textarea id="songs" placeholder="한 줄에 한 곡씩 자동 입력됩니다.">오프닝
꼬마버스가 출발합니다
용감한 자동차들
주룩주룩 첨벙첨벙
천하장사 중장비
뚝딱뚝딱 만능 정비사
꿈나라로 쿨쿨쿨
많이 많이 닮았네
정다운 시골여행
반짝반짝 상쾌한 하루
행복을 배달해요
푸른 하늘 높이
환상의 우주 여행
아침이 밝았어요
엔딩</textarea>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" id="apply">곡 목록 적용</button>
    <button class="btn" id="all">전체 선택</button>
    <button class="btn" id="none">전체 해제</button>
    <button class="btn" id="csvin">CSV 불러오기</button>
    <input id="csvfile" type="file" accept=".csv,text/csv" hidden>
  </div>
</section>

<section class="panel no-print">
  <h2>2. 수록곡 목록 · 추출 여부 선택</h2>
  <div id="tracklist" class="tracklist"></div>
</section>

<section class="panel no-print">
  <h2>3. 곡별 유튜브 후보 지정</h2>
  <div style="margin-bottom:14px">
    <label for="ytkey">YouTube Data API v3 키</label>
    <input id="ytkey" type="password" autocomplete="off" placeholder="Google Cloud API 키 입력">
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <input id="rememberKey" type="checkbox"> 이 기기에 API 키 기억하기
    </label>
  </div>
  <div id="candidateEditor"></div>
</section>

<section class="panel" id="previewPanel">
  <div class="row no-print" style="justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0">미리보기 (A4 1장에 최대 2세트, 헤드라인당 8개)</h2>
    <span class="tag" id="count">0곡 선택</span>
  </div>
  
  <!-- 순수 헤드라인과 썸네일 세트가 렌더링되는 영역 -->
  <div id="previewContainer"></div>

  <div class="row no-print" style="margin-top:20px;gap:8px">
    <button class="btn primary" id="savePreviewHtml">미리보기 HTML 저장 (이미지 보호)</button>
    <button class="btn" id="saveBackupHtml">입력값 포함 전체 HTML 백업</button>
    <button class="btn accent" id="downloadMp3Btn">선택 음원 MP3 다운로드</button>
    <button class="btn" id="savecsv">CSV 저장</button>
    <button class="btn primary" id="print">A4 가로 인쇄 / PDF 저장</button>
  </div>
</section>
</main>

<!-- MP3 다운로드 모달 -->
<div class="modal-overlay" id="mp3Modal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="margin:0;font-size:18px">선택 음원 MP3 다운로드</h3>
      <button class="btn" onclick="$('mp3Modal').style.display='none'">닫기</button>
    </div>
    <p class="hint">선택된 각 음원의 YouTube 링크에서 고음질 MP3를 다운로드할 수 있습니다.</p>
    <div id="mp3List" style="margin:16px 0"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn primary" id="downloadBatScript">PC 일괄 다운로드 스크립트(.bat) 받기</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
